services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profile_rec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profile_rec"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/profile_rec
      MOCK_WECOM: "true"
      MOCK_LLM: "false" # when true, the LLM will be mocked and the LLM_BASE_URL and LLM_MODEL will be ignored
      LLM_PROVIDER: deepseek
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host 8000 is often blocked on Windows (Hyper-V excluded ranges e.g. 7904-8003).
      - "18000:8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/sidebar/dist:/usr/share/nginx/html/sidebar:ro
      - ../apps/admin/dist:/usr/share/nginx/html/admin:ro

volumes:
  pgdata:
